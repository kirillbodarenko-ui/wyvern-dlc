plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.6.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
    maven { url "https://maven.meteordev.org/releases" }
    maven { url "https://maven.meteordev.org" }
}

dependencies {
    minecraft("com.mojang:minecraft:${project.minecraft_version}")

    implementation("net.fabricmc:fabric-loader:${project.loader_version}")
    // Plain `implementation`, not `modImplementation`: MC 26.2 ships unobfuscated, and Loom refuses
    // to create the `mod*` remap configurations in a non-obfuscated environment ("Cannot get remap
    // configurations in a non-obfuscated environment") because there is nothing to remap. The bundle
    // jar carries a root fabric.mod.json, so the loader picks it up off the dev classpath as-is.
    implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
    include implementation("meteordevelopment:discord-ipc:1.1")
    include implementation("meteordevelopment:orbit:0.2.3")
    implementation(shadow("dev.redstones.mediaplayerinfo:media-player-info:0.1.0"))
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(25)
    it.options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

loom {
    accessWidenerPath = file("src/main/resources/wyvern.accesswidener")

}

java {
    def javaVersion = JavaVersion.toVersion(25)
    if (JavaVersion.current() < javaVersion) toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    archiveClassifier.set('thin')
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

shadowJar {
    exclude("org/objectweb/**")
    configurations = [project.configurations.shadow]
    archiveClassifier.set("")
}

tasks.build.dependsOn tasks.shadowJar
